services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: transfer
      POSTGRES_PASSWORD: transfer
      POSTGRES_DB: transfer
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

volumes:
  dbdata:

# Chạy toàn bộ hệ thống trên VPS:  cd deploy && docker compose up -d --build
# Cấu hình nằm trong deploy/.env (sao chép từ .env.example)
name: transfer-prod

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: transfer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Chưa đặt POSTGRES_PASSWORD trong deploy/.env}
      POSTGRES_DB: transfer
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transfer -d transfer"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Không mở cổng cơ sở dữ liệu ra Internet

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://transfer:${POSTGRES_PASSWORD}@db:5432/transfer?schema=public
      JWT_SECRET: ${JWT_SECRET:?Chưa đặt JWT_SECRET trong deploy/.env}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-604800}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      TZ: Asia/Ho_Chi_Minh
      # Sao lưu tự động hằng ngày (giờ chạy, số bản giữ lại cài ở trang Sao lưu & dọn dẹp)
      BACKUP_DIR: /data/backups
      BACKUP_DIR_LABEL: /opt/transfer/deploy/backups
    volumes:
      - uploads:/data/uploads
      - ./backups:/data/backups

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:?Chưa đặt DOMAIN trong deploy/.env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  dbdata:
  uploads:
  caddy_data:
  caddy_config:

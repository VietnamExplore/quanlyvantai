<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />

  <title>Mở phần mềm Quản lý vận tải</title>
  <!-- Phần mềm chạy trên máy chủ VPS (từ 15/10/2026): mở thẳng địa chỉ chính thức -->

           font-family: 'Segoe UI', Arial, sans-serif; padding: 16px; box-sizing: border-box; }
    .card { background: var(--card); border-radius: 12px; padding: 28px 32px; max-width: 520px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,.08); text-align: center; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: var(--muted); line-height: 1.5; margin: 8px 0; }
    a.btn { display: inline-block; margin-top: 16px; background: var(--primary); color: #fff; padding: 9px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; }

</head>
